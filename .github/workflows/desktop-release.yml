name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        default: 0.1.0.2
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Windows desktop release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/ETAB.Engineering.Editor/package-lock.json

      - name: Install verified Inno Setup 7 compiler
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.0.2-x64.exe'
          Invoke-WebRequest `
            -UseBasicParsing `
            -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe' `
            -OutFile $installer

          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          $subject = if ($null -eq $signature.SignerCertificate) {
            '<no signer certificate>'
          } else {
            $signature.SignerCertificate.Subject
          }
          if ($signature.Status -ne 'Valid' -or $subject -notmatch 'O=Pyrsys B\.V\.(?:,|$)') {
            throw "Inno Setup signature validation failed: status=$($signature.Status), subject=$subject"
          }

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-') `
            -WindowStyle Hidden `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)."
          }

          $compilerCandidates = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 7\ISCC.exe'),
            'C:\Program Files\Inno Setup 7\ISCC.exe',
            'C:\Program Files (x86)\Inno Setup 7\ISCC.exe'
          )
          if (-not ($compilerCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })) {
            throw 'The verified Inno Setup installation did not provide ISCC.exe.'
          }

      - name: Build and verify portable bundle and installer
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if (-not $env:GITHUB_REF_NAME.StartsWith('v')) {
              throw "Release tag must start with v."
            }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = '${{ inputs.version }}'
          }

          .\publish-installer-win-x64.ps1 -Version $version
          if ($LASTEXITCODE -ne 0) {
            throw "Desktop publish script failed with exit code $LASTEXITCODE."
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $packageName = "ETAB-Engineering-v$env:RELEASE_VERSION-win-x64"
          $assets = @(
            (Join-Path $PWD "artifacts\$packageName.zip"),
            (Join-Path $PWD "artifacts\$packageName.zip.sha256"),
            (Join-Path $PWD "artifacts\$packageName-setup.exe"),
            (Join-Path $PWD "artifacts\$packageName-setup.exe.sha256")
          )
          $missingAssets = @($assets | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missingAssets.Count -ne 0) {
            throw "Expected release assets are missing: $($missingAssets -join ', ')"
          }

          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @assets `
              --verify-tag `
              --generate-notes `
              --title "ETAB Engineering $env:GITHUB_REF_NAME"
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publication failed with exit code $LASTEXITCODE."
          }

      - name: Upload optional workflow artifact
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ETAB-Engineering-v${{ env.RELEASE_VERSION }}-windows-release
          path: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.sha256
          if-no-files-found: error
          compression-level: 0
